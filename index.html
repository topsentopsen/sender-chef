<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sender-Chef · Der Fernseh-Manager</title>
<meta name="description" content="Retro-TV-Sender-Manager im Amiga-Stil, inspiriert von Mad TV (1991). Läuft direkt im Browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='12' y='2' fill='%230055aa'/%3E%3Crect x='2' y='4' width='12' height='8' fill='%23ff8800'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-item" id="hud-day">Tag 1</div>
    <div class="hud-item" id="hud-clock">08:00</div>
    <div class="hud-item" id="hud-money">0 €</div>
    <div class="hud-item" id="hud-credit">Kredit 0 €</div>
    <div class="hud-item" id="hud-mood">Chefin</div>
    <div class="hud-btns">
      <button id="btn-pause">Pause</button>
      <button id="btn-speed">Tempo 1x</button>
      <button id="btn-evening">Sendeabend starten</button>
      <button id="btn-menu">Menü</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv" width="480" height="300"></canvas>
    <section id="room" class="hidden"></section>
  </main>
  <nav id="rooms"></nav>
  <footer id="ticker"></footer>
  <p class="foot">Sender-Chef · inspiriert von Mad TV (1991) · eigenes Fanprojekt ohne Original-Inhalte</p>
</div>
<div id="overlay" class="hidden"></div>
<script src="js/data.js"></script>
<script src="js/sim.js"></script>
<script src="js/building.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
